name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  # ---------------------------------------------------------------------
  # Functional tests: authentication, access control, SQLi/XSS regressions
  # ---------------------------------------------------------------------
  tests:
    name: Unit tests (pytest)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run test suite
        run: pytest -q

  # ---------------------------------------------------------------------
  # SAST: static analysis of our own code (bandit for Python)
  # ---------------------------------------------------------------------
  sast:
    name: SAST - bandit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Generate JSON report (evidence, never fails the build)
        run: |
          mkdir -p reports
          bandit -r secure_api app.py -f json -o reports/bandit-report.json || true

      - name: Bandit gate - fail the build on MEDIUM or HIGH findings
        run: bandit -r secure_api app.py -ll -f screen

      - name: Upload SAST report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: bandit-report
          path: reports/bandit-report.json
          if-no-files-found: warn

  # ---------------------------------------------------------------------
  # SCA: known CVEs in third-party dependencies (pip-audit / OSV database)
  # ---------------------------------------------------------------------
  sca:
    name: SCA - pip-audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Generate JSON report (evidence, never fails the build)
        run: |
          mkdir -p reports
          pip-audit -r requirements.txt -f json -o reports/pip-audit-report.json || true

      - name: pip-audit gate - fail the build if a dependency has a known CVE
        run: pip-audit -r requirements.txt --progress-spinner off --strict

      - name: Upload SCA report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pip-audit-report
          path: reports/pip-audit-report.json
          if-no-files-found: warn
